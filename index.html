<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Uptime Dashboard • Last 24h</title>
  <meta http-equiv="refresh" content="900">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            up: '#22c55e',
            down: '#ef4444',
          }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-slate-950 to-gray-900 p-4 md:p-6 font-sans antialiased">
  <div class="max-w-6xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
        Website Uptime Monitor
      </h1>
      <p class="text-gray-400 text-base">Real-time status • Last 24 hours • Page refreshes every 15 min</p>
    </header>

    <div id="dashboard" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-12">
      <!-- Loading state -->
      <div class="col-span-full text-center py-12 text-gray-500 text-lg animate-pulse">
        Loading dashboard data...
      </div>
    </div>

    <!-- Advanced Charts Section -->
    <div id="advanced-charts" class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Response Time Trends -->
      <div class="bg-gray-800/70 backdrop-blur-md border border-gray-700/60 rounded-xl p-5 shadow-xl">
        <h3 class="text-lg font-semibold mb-3 text-center">Response Time Trends (Last 24h)</h3>
        <div class="h-56 md:h-64">
          <canvas id="response-trend-chart"></canvas>
        </div>
      </div>

      <!-- Uptime % Last 7 Days -->
      <div class="bg-gray-800/70 backdrop-blur-md border border-gray-700/60 rounded-xl p-5 shadow-xl">
        <h3 class="text-lg font-semibold mb-3 text-center">Uptime % (Last 7 Days)</h3>
        <div class="h-56 md:h-64">
          <canvas id="uptime-7days-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sites = [
      "https://auapp.app/",
      "https://robot.labelnow.io/",
      "https://aicc.smf.it.com/",
      "https://labelnow.io/"
    ];

    fetch("uptime-log.json?_=" + Date.now() + "&nocache=" + Math.random())
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        const now = Date.now();
        const dayAgo = now - 24 * 60 * 60 * 1000;
        const weekAgo = now - 7 * 24 * 60 * 60 * 1000;

        const recent = data.filter(e => {
          if (!e?.time) return false;
          const t = new Date(e.time).getTime();
          return !isNaN(t) && t >= dayAgo && t <= now;
        });

        const lastWeek = data.filter(e => {
          if (!e?.time) return false;
          const t = new Date(e.time).getTime();
          return !isNaN(t) && t >= weekAgo && t <= now;
        });

        const container = document.getElementById("dashboard");
        container.innerHTML = "";

        if (recent.length === 0) {
          container.innerHTML = `<p class="col-span-full text-center py-12 text-yellow-400 text-lg">No data in last 24h</p>`;
          return;
        }

        // Smaller main cards (no bottom bar/chart)
        sites.forEach(url => {
          const entries = recent.filter(e => e.site === url);
          const total = entries.length;
          const upCount = entries.filter(e => e.status === "UP").length;
          const uptimePct = total > 0 ? (upCount / total) * 100 : 0;
          const lastStatus = total > 0 ? entries[entries.length - 1].status : "UNKNOWN";
          const avgDuration = total > 0 ? Math.round(entries.reduce((s, e) => s + (Number(e.duration_ms) || 0), 0) / total) : '—';

          const card = document.createElement("div");
          card.className = `
            bg-gray-800/70 backdrop-blur-md border border-gray-700/60 rounded-xl p-4 shadow-xl text-center
            hover:shadow-emerald-500/20 hover:border-emerald-500/40 transition-all duration-300
          `;

          card.innerHTML = `
            <h3 class="text-base font-semibold mb-3 truncate" title="${url}">
              ${url.replace(/^https?:\/\//, '').replace(/^www\./, '')}
            </h3>

            <div class="relative w-24 h-24 mx-auto mb-3">
              <svg class="w-full h-full" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="54" fill="none" stroke="#1f2937" stroke-width="10" />
                <circle cx="60" cy="60" r="54" fill="none" 
                  stroke="${lastStatus === 'UP' ? '#22c55e' : '#ef4444'}"
                  stroke-width="10" 
                  stroke-dasharray="339" 
                  stroke-dashoffset="${339 - (339 * uptimePct / 100)}"
                  stroke-linecap="round" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <div class="text-2xl font-bold">${Math.round(uptimePct)}</div>
                <div class="text-xs text-gray-400">%</div>
              </div>
            </div>

            <div class="text-3xl font-bold ${lastStatus === 'UP' ? 'text-up drop-shadow-[0_0_6px_#22c55e]' : 'text-down drop-shadow-[0_0_6px_#ef4444]'}">
              ${lastStatus}
            </div>
            <div class="text-xs text-gray-500 mt-1">Last check</div>

            <div class="mt-3 text-xs text-gray-400">
              ${upCount} / ${total} • Avg: ${avgDuration} ms
            </div>
          `;

          container.appendChild(card);
        });

        // Advanced charts - Response Time Trends
        const responseCtx = document.getElementById("response-trend-chart")?.getContext('2d');
        if (responseCtx) {
          const timeLabels = recent.map(e => new Date(e.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
          const durations = recent.map(e => e.duration_ms || 0);

          new Chart(responseCtx, {
            type: 'line',
            data: {
              labels: timeLabels,
              datasets: [{
                label: 'Response Time (ms)',
                data: durations,
                borderColor: '#22c55e',
                backgroundColor: 'rgba(34,197,94,0.25)',
                fill: true,
                tension: 0.4,
                pointRadius: 2,
                pointHoverRadius: 5,
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              plugins: {
                legend: { display: false },
                tooltip: { enabled: true }
              },
              scales: {
                x: { display: false },
                y: { beginAtZero: true, title: { display: true, text: 'ms' } }
              }
            }
          });
        }

        // Uptime % Last 7 Days (placeholder - real calculation can be added later)
        const uptime7daysCtx = document.getElementById("uptime-7days-chart")?.getContext('2d');
        if (uptime7daysCtx) {
          const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
          const uptimeDays = [100, 100, 100, 100, 100, 100, 100]; // Placeholder - can calculate from lastWeek

          new Chart(uptime7daysCtx, {
            type: 'bar',
            data: {
              labels: days,
              datasets: [{
                label: 'Uptime %',
                data: uptimeDays,
                backgroundColor: '#22c55e',
                borderColor: '#22c55e',
                borderWidth: 1
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, max: 100, title: { display: true, text: '%' } }
              }
            }
          });
        }
      })
      .catch(err => {
        console.error("Dashboard error:", err);
        document.getElementById("dashboard").innerHTML = `
          <div class="col-span-full text-center py-16 text-red-400 text-xl">
            Failed to load data: ${err.message}
          </div>
        `;
      });
  </script>
</body>
</html>
